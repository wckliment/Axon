[project]
name = "axon"
version = "0.1.0"
description = "Deterministic task orchestration engine for LLM-generated plans"
readme = "README.md"
requires-python = ">=3.11"

authors = [
  { name = "Chase Kliment" }
]

dependencies = [
  "openai>=1.0.0"
]

[project.scripts]
axon = "app.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"